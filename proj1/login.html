<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Financial Planner</h1>
            </div>
        </nav>
    </header>
    <main>
        <h2>Log in</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Login</button>
                <a href="register.html" class="btn register-btn">Register</a>
            </div>
            <button type="button" id="guest-btn" class="btn" style="margin-top: 10px;">Try it as a guest</button>
        </form>
        <p id="error-message" style="color: red; display: none;">Invalid email or password. Please try again.</p>
    </main>
<script src="js/login.js"></script>
</body>
</html>
