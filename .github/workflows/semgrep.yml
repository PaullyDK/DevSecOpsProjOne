name: Semgrep

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Setup node
        run: apk add --no-cache nodejs npm

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: semgrep scan --config p/javascript --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: ${{ always() && !env.ACT }}
